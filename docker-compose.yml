services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4010:4010"
    environment:
      - TWILIO_HOST=0.0.0.0
      - TWILIO_PORT=4010
      - DB_PATH=/app/data/smspit.db
    volumes:
      - smspit-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "4011:4011"
    environment:
      - WEB_PORT=4011
      - API_URL=http://api:4010
    depends_on:
      - api
    restart: unless-stopped

volumes:
  smspit-data: